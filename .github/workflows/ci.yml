name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          channels: conda-forge,bioconda
          channel-priority: strict
          conda-remove-defaults: "true"
          activate-environment: snakemake
          python-version: "3.12"

      - name: Install Snakemake
        run: conda install -y "snakemake>=8"

      - name: Lint
        run: snakemake -s workflow/Snakefile --directory .test --lint

      - name: Dry run
        run: snakemake -s workflow/Snakefile --directory .test -n

      - name: Run on synthetic test data
        run: snakemake -s workflow/Snakefile --directory .test --sdm conda --cores 2 --show-failed-logs
